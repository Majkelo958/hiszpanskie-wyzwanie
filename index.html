<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiszpańskie Wyzwanie</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --freeze: #2980b9;
            --recovery: #d35400;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .section { display: none; }
        .section.active { display: block; }
        h1, h2 { color: var(--primary); text-align: center; }
        
        /* Ekran logowania */
        #loginSection { text-align: center; padding: 40px 0; }
        #loginSection input { padding: 12px 20px; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; width: 60%; max-width: 300px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        #loginSection button { padding: 12px 30px; font-size: 18px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #loginSection button:hover { background-color: #34495e; }

        /* Panel główny i statystyki */
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f1f2f6; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; }
        .stat-card span { display: block; font-size: 22px; color: var(--primary); margin-top: 5px; }

        /* Siatka dni */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; margin-top: 20px; }
        .day-box { aspect-ratio: 1; border: 2px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; background: #fff; transition: all 0.2s; font-size: 16px; }
        .day-box:hover { transform: scale(1.05); border-color: #b2bec3; }
        .day-box.done { background-color: var(--success); color: white; border-color: #219653; }
        .day-box.frozen { background-color: var(--freeze); color: white; border-color: #1b4f72; }
        .day-box.recovered { background-color: var(--recovery); color: white; border-color: #a04000; }
        .day-box.missed { background-color: var(--accent); color: white; border-color: #b03a2e; }

        /* Tabela wyników */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #dfe4ea; padding: 12px; text-align: left; }
        th { background-color: #f1f2f6; color: var(--primary); font-weight: bold; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sekcja Logowania -->
        <div id="loginSection" class="section active">
            <h1>Hiszpańskie Wyzwanie</h1>
            <p>Wpisz swoje imię, aby otworzyć swój panel:</p>
            <input type="text" id="usernameInput" placeholder="Twoje imię...">
            <button onclick="handleLogin()">Wejdź do wyzwania</button>
        </div>

        <!-- Sekcja Panelu Głównego -->
        <div id="dashboardSection" class="section">
            <h1 id="welcomeUser">Witaj</h1>
            
            <div class="stats-container">
                <div class="stat-card">
                    Zamrożenia
                    <span><span id="freezesCount">2</span>/<span id="maxFreezesLimit">2</span></span>
                </div>
                <div class="stat-card">
                    Nadrobienia
                    <span><span id="recoveriesCount">2</span>/2</span>
                </div>
            </div>

            <h2>Twój Miesięczny Postęp (Dni 1-30)</h2>
            <div id="daysGrid" class="grid"></div>

            <div style="margin-top: 40px;">
                <h2>Tablica Wyników</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Miejsce</th>
                            <th>Użytkownik</th>
                            <th>Ukończone dni</th>
                            <th>Zamrożenia</th>
                            <th>Nadrobienia</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Wypełniane dynamicznie -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // TUTAJ WKLEJ SWÓJ URL WEB APP Z GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyh-ZPnm-qfl24kgnS4kqGl7K6SaRtnUZU6LkoFrsOCZ_gjvpPiUEW85VfRNwDZmbek/exec"; 

        let currentUser = "";
        let userData = {};

        function handleLogin() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert("Wpisz swoje imię!");
                return;
            }
            currentUser = input;
            loadUserData();
        }

        async function loadUserData() {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('welcomeUser').innerText = `Witaj, ${currentUser}!`;

            try {
                const [userResponse, leaderboardResponse] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getUserData&user=${encodeURIComponent(currentUser)}`),
                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                ]);

                const userResult = await userResponse.json();
                const leaderboardResult = await leaderboardResponse.json();
                
                if (userResult.success) {
                    userData = userResult.days || {};
                    document.getElementById('freezesCount').innerText = userResult.freezesCount;
                    document.getElementById('maxFreezesLimit').innerText = userResult.maxLimit ?? 2;
                    document.getElementById('recoveriesCount').innerText = userResult.recoveriesCount;
                    renderGrid();
                }

                if (leaderboardResult.success) {
                    renderLeaderboard(leaderboardResult.data);
                }

            } catch (err) {
                console.error('Błąd podczas ładowania danych:', err);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const box = document.createElement('div');
                box.className = 'day-box';
                box.innerText = i;
                
                const status = userData[i];
                if (status) {
                    box.classList.add(status);
                }

                box.onclick = () => cycleDayStatus(i);
                grid.appendChild(box);
            }
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${index + 1}</td>
                    <td><b>${row.user}</b></td>
                    <td>${row.done}</td>
                    <td>${row.freezes}</td>
                    <td>${row.recoveries}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function cycleDayStatus(day) {
            const currentStatus = userData[day] || 'none';
            let nextStatus = 'none';

            if (currentStatus === 'none') nextStatus = 'done';
            else if (currentStatus === 'done') nextStatus = 'frozen';
            else if (currentStatus === 'frozen') nextStatus = 'recovered';
            else if (currentStatus === 'recovered') nextStatus = 'missed';
            else if (currentStatus === 'missed') nextStatus = 'none';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateDay',
                        user: currentUser,
                        day: day,
                        status: nextStatus
                    })
                });

                const result = await response.json();
                if (result.success) {
                    if (nextStatus === 'none') {
                        delete userData[day];
                    } else {
                        userData[day] = nextStatus;
                    }
                    
                    if (result.freezesCount !== undefined) {
                        document.getElementById('freezesCount').innerText = result.freezesCount;
                    }
                    if (result.maxLimit !== undefined) {
                        document.getElementById('maxFreezesLimit').innerText = result.maxLimit;
                    }
                    if (result.recoveriesCount !== undefined) {
                        document.getElementById('recoveriesCount').innerText = result.recoveriesCount;
                    }

                    renderGrid();
                    
                    // Odśwież ranking w tle
                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                        .then(res => res.json())
                        .then(leaderboardResult => {
                            if (leaderboardResult.success) {
                                renderLeaderboard(leaderboardResult.data);
                            }
                        });
                } else {
                    alert(result.message);
                }
            } catch (err) {
                console.error('Błąd połączenia z serwerem:', err);
            }
        }
    </script>
</body>
</html>
