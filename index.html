<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiszpańskie Wyzwanie</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section { display: none; }
        .section.active { display: block; }
        h1, h2 { color: #2c3e50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 20px; }
        .day-box { aspect-ratio: 1; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; background: #fff; transition: all 0.2s; }
        .day-box.done { background-color: #2ecc71; color: white; border-color: #27ae60; }
        .day-box.frozen { background-color: #3498db; color: white; border-color: #2980b9; }
        .day-box.recovered { background-color: #e67e22; color: white; border-color: #d35400; }
        .day-box.missed { background-color: #e74c3c; color: white; border-color: #c0392b; }
        .stats-panel { display: flex; justify-content: space-between; background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; margin-right: 10px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sekcja Logowania -->
        <div id="loginSection" class="section active">
            <h1>Hiszpańskie Wyzwanie</h1>
            <p>Wpisz swoje imię, aby dołączyć:</p>
            <input type="text" id="usernameInput" placeholder="Twoje imię...">
            <button onclick="handleLogin()">Wejdź</button>
        </div>

        <!-- Sekcja Panelu Głównego -->
        <div id="dashboardSection" class="section">
            <h1 id="welcomeUser">Witaj</h1>
            
            <div class="stats-panel">
                <div>Zamrożenia: <span id="freezesCount">2</span>/<span id="maxFreezesLimit">2</span></div>
                <div>Nadrobienia: <span id="recoveriesCount">2</span>/2</div>
            </div>

            <h2>Twój Miesięczny Postęp (Dni 1-30)</h2>
            <div id="daysGrid" class="grid"></div>

            <div style="margin-top: 30px;">
                <h2>Tablica Wyników</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Miejsce</th>
                            <th>Użytkownik</th>
                            <th>Ukończone</th>
                            <th>Zamrożenia</th>
                            <th>Nadrobienia</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Tutaj wpadają dane z rankingu -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // TUTAJ WKLEJ SWÓJ URL WEJŚCIOWY Z GOOGLE APPS SCRIPT WPROWADZENIA WEB APP
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby53VhRwZZ9cnnrarRM_xkpHgBky2cs1apqkNMYqn-l_E2EenpcU8feYPmCdtMxQaiD/exec"; 

        let currentUser = "";
        let userData = {};

        function handleLogin() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert("Wpisz imię!");
                return;
            }
            currentUser = input;
            loadUserData();
        }

        async function loadUserData() {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('welcomeUser').innerText = `Witaj, ${currentUser}!`;

            try {
                const [userResponse, leaderboardResponse] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getUserData&user=${encodeURIComponent(currentUser)}`),
                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                ]);

                const userResult = await userResponse.json();
                const leaderboardResult = await leaderboardResponse.json();
                
                if (userResult.success) {
                    userData = userResult.days || {};
                    document.getElementById('freezesCount').innerText = userResult.freezesCount;
                    document.getElementById('maxFreezesLimit').innerText = userResult.maxLimit;
                    document.getElementById('recoveriesCount').innerText = userResult.recoveriesCount;
                    renderGrid();
                }

                if (leaderboardResult.success) {
                    const tbody = document.getElementById('leaderboardBody');
                    tbody.innerHTML = '';
                    
                    leaderboardResult.data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>#${index + 1}</td>
                            <td>${row.user}</td>
                            <td><b>${row.done}</b></td>
                            <td>${row.freezes}</td>
                            <td>${row.recoveries}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

            } catch (err) {
                console.error('Nie udało się pobrać danych', err);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const box = document.createElement('div');
                box.className = 'day-box';
                box.innerText = i;
                
                const status = userData[i];
                if (status) {
                    box.classList.add(status);
                }

                box.onclick = () => cycleDayStatus(i);
                grid.appendChild(box);
            }
        }

        async function cycleDayStatus(day) {
            const currentStatus = userData[day] || 'none';
            let nextStatus = 'none';

            if (currentStatus === 'none') nextStatus = 'done';
            else if (currentStatus === 'done') nextStatus = 'frozen';
            else if (currentStatus === 'frozen') nextStatus = 'recovered';
            else if (currentStatus === 'recovered') nextStatus = 'missed';
            else if (currentStatus === 'missed') nextStatus = 'none';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateDay',
                        user: currentUser,
                        day: day,
                        status: nextStatus
                    })
                });

                const result = await response.json();
                if (result.success) {
                    if (nextStatus === 'none') {
                        delete userData[day];
                    } else {
                        userData[day] = nextStatus;
                    }
                    
                    if (result.freezesCount !== undefined) {
                        document.getElementById('freezesCount').innerText = result.freezesCount;
                    }
                    if (result.maxLimit !== undefined) {
                        document.getElementById('maxFreezesLimit').innerText = result.maxLimit;
                    }
                    if (result.recoveriesCount !== undefined) {
                        document.getElementById('recoveriesCount').innerText = result.recoveriesCount;
                    }

                    renderGrid();
                    
                    // Odśwież tablicę wyników w tle
                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                        .then(res => res.json())
                        .then(leaderboardResult => {
                            if (leaderboardResult.success) {
                                const tbody = document.getElementById('leaderboardBody');
                                tbody.innerHTML = '';
                                leaderboardResult.data.forEach((row, index) => {
                                    const tr = document.createElement('tr');
                                    tr.innerHTML = `
                                        <td>#${index + 1}</td>
                                        <td>${row.user}</td>
                                        <td><b>${row.done}</b></td>
                                        <td>${row.freezes}</td>
                                        <td>${row.recoveries}</td>
                                    `;
                                    tbody.appendChild(tr);
                                });
                            }
                        });
                } else {
                    alert(result.message);
                }
            } catch (err) {
                console.error('Błąd połączenia z serwerem', err);
            }
        }
    </script>
</body>
</html>
