<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiszpańskie Wyzwanie</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --freeze: #3498db;
            --recovery: #e67e22;
            --bg: #f4f6f9;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .section { display: none; }
        .section.active { display: block; }
        h1, h2 { color: var(--primary); text-align: center; font-size: 24px; }
        
        /* Ekran logowania */
        #loginSection { text-align: center; padding: 40px 0; }
        #loginSection input { padding: 12px 20px; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; width: 80%; max-width: 300px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        #loginSection button { padding: 12px 30px; font-size: 18px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #loginSection button:hover { background-color: #34495e; }

        /* Panel główny i statystyki */
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #ecf0f1; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 14px; color: #34495e; }
        .stat-card span { display: block; font-size: 20px; color: var(--primary); margin-top: 5px; }

        /* Kafelki Nagród */
        .awards-container { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 25px; }
        @media(min-width: 600px) {
            .awards-container { grid-template-columns: repeat(2, 1fr); }
        }
        .award-card { background: linear-gradient(135deg, #f39c12, #f1c40f); color: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3); }
        .award-card h3 { margin: 0 0 6px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .award-card p { margin: 0; font-size: 17px; font-weight: bold; word-break: break-word; }

        /* Siatka dni */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; margin-top: 15px; }
        .day-box { aspect-ratio: 1; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; background: #fff; transition: all 0.2s; font-size: 15px; }
        .day-box:hover { transform: scale(1.05); border-color: #b2bec3; }
        .day-box.done { background-color: var(--success); color: white; border-color: #219653; }
        .day-box.frozen { background-color: var(--freeze); color: white; border-color: #2980b9; }
        .day-box.recovered { background-color: var(--recovery); color: white; border-color: #d35400; }
        .day-box.missed { background-color: var(--accent); color: white; border-color: #b03a2e; }

        /* Modal wyboru statusu */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 20px; border-radius: 14px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
        .modal h3 { margin-top: 0; color: var(--primary); font-size: 18px; }
        .modal-btn { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .modal-btn.btn-done { background-color: var(--success); }
        .modal-btn.btn-missed { background-color: var(--accent); }
        .modal-btn.btn-freeze { background-color: var(--freeze); }
        .modal-btn.btn-recovery { background-color: var(--recovery); }
        .modal-btn.btn-clear { background-color: #95a5a6; }
        .modal-btn:hover { opacity: 0.9; }

        /* Responsywna tabela wyników z płynnym przewijaniem na telefonie */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 14px; }
        th, td { border: 1px solid #dfe4ea; padding: 10px 12px; text-align: left; }
        th { background-color: #f1f2f6; color: var(--primary); font-weight: bold; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sekcja Logowania -->
        <div id="loginSection" class="section active">
            <h1>Hiszpańskie Wyzwanie</h1>
            <p>Wpisz swoje imię, aby otworzyć panel:</p>
            <input type="text" id="usernameInput" placeholder="Twoje imię...">
            <button onclick="handleLogin()">Wejdź do wyzwania</button>
        </div>

        <!-- Sekcja Panelu Głównego -->
        <div id="dashboardSection" class="section">
            <h1 id="welcomeUser">Witaj</h1>
            
            <div class="stats-container">
                <div class="stat-card">
                    Zamrożenia
                    <span id="freezesCount">2</span>/2
                </div>
                <div class="stat-card">
                    Nadrobienia
                    <span id="recoveriesCount">2</span>/2
                </div>
            </div>

            <!-- Kafelki Nagród -->
            <div class="awards-container">
                <div class="award-card">
                    <h3>🏆 Campeón de la Disciplina</h3>
                    <p id="championAward">-</p>
                </div>
                <div class="award-card" style="background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);">
                    <h3>🔥 Mejor Racha</h3>
                    <p id="streakAward">-</p>
                </div>
            </div>

            <h2>Twój Miesięczny Postęp (Dni 1-30)</h2>
            <div id="daysGrid" class="grid"></div>

            <div style="margin-top: 30px;">
                <h2>Tablica Wyników</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Miejsce</th>
                                <th>Użytkownik</th>
                                <th>Ukończone</th>
                                <th>Zamrożenia</th>
                                <th>Nadrobienia</th>
                                <th>Passa</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <!-- Wypełniane dynamicznie -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal wyboru statusu dnia -->
    <div id="statusModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Wybierz status</h3>
            <button class="modal-btn btn-done" onclick="setStatus('done')">✅ Zaliczone</button>
            <button class="modal-btn btn-missed" onclick="setStatus('missed')">❌ Nie zaliczono</button>
            <button class="modal-btn btn-freeze" onclick="setStatus('frozen')">❄️ Zamrożenie</button>
            <button class="modal-btn btn-recovery" onclick="setStatus('recovered')">🔥 Nadrobiono</button>
            <button class="modal-btn btn-clear" onclick="setStatus('none')">🗑️ Wyczyść status</button>
            <button style="background:none; border:none; color:#7f8c8d; margin-top:10px; cursor:pointer; font-size:14px;" onclick="closeModal()">Zamknij</button>
        </div>
    </div>

    <script>
        // TUTAJ WKLEJ SWÓJ URL WEJŚCIOWY Z GOOGLE APPS SCRIPT WEB APP
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCKnU0HxIOwCS-nS-0pbNAE4uYShjflasrLOG0IwMsKn7UABfdVvT78f_QHSoGDPRI/exec"; 

        let currentUser = "";
        let userData = {};
        let selectedDay = null;

        function handleLogin() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert("Wpisz swoje imię!");
                return;
            }
            currentUser = input;
            loadUserData();
        }

        async function loadUserData() {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('welcomeUser').innerText = `Witaj, ${currentUser}!`;

            try {
                const [userResponse, leaderboardResponse] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getUserData&user=${encodeURIComponent(currentUser)}`),
                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                ]);

                const userResult = await userResponse.json();
                const leaderboardResult = await leaderboardResponse.json();
                
                if (userResult.success) {
                    userData = userResult.days || {};
                    document.getElementById('freezesCount').innerText = userResult.freezesCount;
                    document.getElementById('recoveriesCount').innerText = userResult.recoveriesCount;
                    renderGrid();
                }

                if (leaderboardResult.success) {
                    renderLeaderboard(leaderboardResult.data);
                }

            } catch (err) {
                console.error('Błąd podczas ładowania danych:', err);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const box = document.createElement('div');
                box.className = 'day-box';
                box.innerText = i;
                
                const status = userData[i];
                if (status) {
                    box.classList.add(status);
                }

                box.onclick = () => openModal(i);
                grid.appendChild(box);
            }
        }

        function openModal(day) {
            selectedDay = day;
            document.getElementById('modalTitle').innerText = `Dzień ${day} - Wybierz status`;
            document.getElementById('statusModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('statusModal').classList.remove('active');
            selectedDay = null;
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            
            let bestDone = -1;
            let championName = "Brak";
            
            let bestStreak = -1;
            let streakLeaderName = "Brak";

            data.forEach((row, index) => {
                if (row.done > bestDone) {
                    bestDone = row.done;
                    championName = `${row.user} (${row.done} dni)`;
                } else if (row.done === bestDone && bestDone > 0) {
                    championName += `, ${row.user}`;
                }

                if (row.streak > bestStreak) {
                    bestStreak = row.streak;
                    streakLeaderName = `${row.user} (${row.streak} z rzędu)`;
                } else if (row.streak === bestStreak && bestStreak > 0) {
                    streakLeaderName += `, ${row.user}`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${index + 1}</td>
                    <td><b>${row.user}</b></td>
                    <td>${row.done}</td>
                    <td>${row.freezes}</td>
                    <td>${row.recoveries}</td>
                    <td>${row.streak} dni</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('championAward').innerText = bestDone > 0 ? championName : "Brak danych";
            document.getElementById('streakAward').innerText = bestStreak > 0 ? streakLeaderName : "Brak danych";
        }

        async function setStatus(nextStatus) {
            if (!selectedDay) return;
            const day = selectedDay;
            const previousStatus = userData[day];
            closeModal();

            if (nextStatus === 'none') {
                delete userData[day];
            } else {
                userData[day] = nextStatus;
            }
            renderGrid();

            let tempFreezes = 0;
            let tempRecoveries = 0;
            for (let d in userData) {
                if (userData[d] === 'frozen') tempFreezes++;
                if (userData[d] === 'recovered') tempRecoveries++;
            }
            document.getElementById('freezesCount').innerText = 2 - tempFreezes;
            document.getElementById('recoveriesCount').innerText = 2 - tempRecoveries;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateDay',
                        user: currentUser,
                        day: day,
                        status: nextStatus
                    })
                });

                const result = await response.json();
                if (result.success) {
                    if (result.freezesCount !== undefined) {
                        document.getElementById('freezesCount').innerText = result.freezesCount;
                    }
                    if (result.recoveriesCount !== undefined) {
                        document.getElementById('recoveriesCount').innerText = result.recoveriesCount;
                    }

                    fetch(`${SCRIPT_URL}?action=getLeaderboard`)
                        .then(res => res.json())
                        .then(leaderboardResult => {
                            if (leaderboardResult.success) {
                                renderLeaderboard(leaderboardResult.data);
                            }
                        });
                } else {
                    if (previousStatus) {
                        userData[day] = previousStatus;
                    } else {
                        delete userData[day];
                    }
                    renderGrid();
                    loadUserData(); 
                    alert(result.message);
                }
            } catch (err) {
                console.error('Błąd połączenia z serwerem:', err);
                if (previousStatus) {
                    userData[day] = previousStatus;
                } else {
                    delete userData[day];
                }
                renderGrid();
                alert("Błąd połączenia z serwerem. Zmiana została cofnięta.");
            }
        }
    </script>
</body>
</html>
